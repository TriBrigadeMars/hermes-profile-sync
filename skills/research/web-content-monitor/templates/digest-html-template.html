<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Job Digest</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 20px; background: #f8f9fa; }
.container { max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
h1 { color: #1a1a1a; border-bottom: 3px solid #522FF4; padding-bottom: 10px; margin-top: 0; }
.source-header { background: #f0f0f0; padding: 12px 16px; margin: 24px 0 12px; border-radius: 8px; font-weight: 600; font-size: 16px; }
.job-item { padding: 12px 16px; border-bottom: 1px solid #eee; }
.job-title { font-weight: 600; font-size: 15px; margin: 0 0 4px; }
.job-link { color: #522FF4; text-decoration: none; font-size: 13px; word-break: break-all; }
.job-link:hover { text-decoration: underline; }
.stats { background: #522FF4; color: white; padding: 12px 20px; border-radius: 8px; text-align: center; margin-top: 20px; font-size: 16px; }
.meta { color: #888; font-size: 12px; }
</style></head>
<body>
<div class="container">
<h1>📋 Daily Digest — {{DATE}}</h1>
<p style="color: #666;">Sources: {{SOURCES}}</p>

{{ITEMS}}

</div>
<div class="stats">📊 Total: {{TOTAL}} new items</div>
</body>
</html>
