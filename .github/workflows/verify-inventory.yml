name: verify-inventory

# Guardrail (see AGENTS.md): fails if custom-skills-inventory.md documents
# skills that have no code in skills/, or if repo skills are undocumented,
# or if a SKILL.md's front-matter name disagrees with its folder name.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify inventory parity
        run: python3 scripts/verify_inventory.py
